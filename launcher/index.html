<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Room</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, system-ui, "Segoe UI", "LG Smart", sans-serif;
    overflow: hidden;
  }
  body { user-select: none; }
  .stage {
    width: 1920px;
    height: 1080px;
    position: absolute;
    left: 50%;
    top: 50%;
    margin-left: -960px;
    margin-top: -540px;
    background: #000;
    transform-origin: center center;
  }
  .shell {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 52px 56px 40px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 0 8px 28px;
  }
  .brand {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: #fff;
  }
  .when { text-align: right; }
  .clock {
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .date {
    margin-top: 2px;
    font-size: 16px;
    color: #a7a7a7;
  }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr 1fr 1fr 1fr;
    grid-gap: 22px 16px;
    min-height: 0;
    padding: 8px;
  }
  .tile {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    margin: 0;
    padding: 0;
    border-radius: 16px;
    background: #181818;
    color: #fff;
    text-align: center;
    min-width: 0;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1), background-color 240ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mark {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wash {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 240px;
    height: 240px;
    margin-left: -120px;
    margin-top: -120px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, rgba(0, 0, 0, 0) 68%);
    opacity: 0;
    transform: scale(0.64);
    transition: opacity 240ms cubic-bezier(0.22, 1, 0.36, 1), transform 280ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .tile.focused .wash {
    opacity: 0.5;
    transform: scale(1);
  }
  .logo {
    position: relative;
    z-index: 1;
    width: 62%;
    height: 64%;
    margin: 0;
    object-fit: contain;
  }
  .logo.mono {
    filter: brightness(0) invert(1);
  }
  .tile .name {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 16px;
    z-index: 1;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .tile.focused {
    z-index: 2;
    background: #242424;
    transform: scale(1.04);
    box-shadow: 0 0 0 2px #fff;
  }
  @media (prefers-reduced-motion: reduce) {
    .wash { transition: none; }
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 26px 8px 0;
  }
  .action { font-size: 20px; color: #a7a7a7; }
  .keys {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6a6a6a;
  }
  .site {
    display: none;
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    border: 0;
    background: transparent;
    z-index: 6;
  }
  .site.open { display: block; }
  /* While Spelunkr plays, make the whole stack transparent so the TV's
     hardware video plane shows through instead of our black background. */
  body.playing, body.playing .stage { background: transparent; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="squircle" clipPathUnits="objectBoundingBox">
        <path d="M0.22,0 H0.78 C0.94,0 1,0.06 1,0.22 V0.78 C1,0.94 0.94,1 0.78,1 H0.22 C0.06,1 0,0.94 0,0.78 V0.22 C0,0.06 0.06,0 0.22,0 Z"/>
      </clipPath>
    </defs>
  </svg>
  <div class="stage" id="stage">
    <div class="shell">
      <header>
        <div class="brand">Living Room</div>
        <div class="when">
          <div class="clock" id="clock"></div>
          <div class="date" id="date"></div>
        </div>
      </header>
      <div class="grid" id="grid"></div>
      <footer>
        <div class="action" id="action"></div>
        <div class="keys">Arrows move · Enter opens</div>
      </footer>
    </div>
    <iframe class="site" id="site" title="Spelunkr" allow="autoplay; fullscreen"></iframe>
    <div id="hud" style="display:none;position:absolute;left:18px;top:16px;z-index:9;background:rgba(0,0,0,0.72);color:#fff;font-size:18px;font-weight:600;padding:6px 14px;border-radius:10px;">Back to exit</div>
  </div>
<script>
(function () {
  var SERVICES = [
    { name: "Nost4lgia", url: "https://spelunkr.tv", web: true, keys: true, logo: "nost4lgia.svg", glow: "#ff6ec7" },
    { name: "Netflix", url: "https://www.netflix.com", appId: "netflix", logo: "netflix.svg", mono: true, glow: "#e50914" },
    { name: "Hulu", url: "https://www.hulu.com", appId: "hulu", logo: "hulu.svg", mono: true, glow: "#1ce783" },
    { name: "Disney+", url: "https://www.disneyplus.com", appId: "com.disney.disneyplus-prod", logo: "disneyplus.svg", glow: "#113ccf" },
    { name: "Paramount+", url: "https://www.paramountplus.com", appId: "com.cbs-all-access.webapp.prod", logo: "paramountplus.svg", mono: true, glow: "#0064ff" },
    { name: "Peacock", url: "https://www.peacocktv.com", appId: "com.peacock.tv", logo: "peacock.svg", glow: "#6e55dc" },
    { name: "YouTube", url: "https://www.youtube.com", appId: "youtube.leanback.v4", logo: "youtube.svg", mono: true, glow: "#ff4e45" },
    { name: "Prime Video", url: "https://www.primevideo.com", appId: "amazon", logo: "primevideo.svg", mono: true, glow: "#1399ff" },
    { name: "Apple TV", url: "https://tv.apple.com", appId: "com.apple.appletv", logo: "appletv.svg", mono: true, glow: "#d8d4cc" },
    { name: "HBO Max", url: "https://play.max.com", appId: "com.wbd.stream", logo: "hbomax.svg", mono: true, glow: "#7b5cff" },
    { name: "Crunchyroll", url: "https://www.crunchyroll.com", appId: "com.crunchyroll.webapp", logo: "crunchyroll.svg", mono: true, glow: "#f47521" },
    { name: "Dropout", url: "https://www.dropout.tv", appId: "com.collegehumor.chdropout", logo: "dropout.svg", mono: true, glow: "#ff5a36" },
    { name: "Tubi", url: "https://tubitv.com", appId: "com.tubitv.ott.tubi", logo: "tubi.svg", mono: true, glow: "#ff7a1a" },
    { name: "Pluto TV", url: "https://pluto.tv", appId: "com.plutotv.app", logo: "plutotv.svg", glow: "#ffe14a" },
    { name: "Spotify", url: "https://open.spotify.com", web: true, logo: "spotify.svg", mono: true, glow: "#1ed760" },
    { name: "Developer Mode", url: "https://webostv.developer.lge.com", appId: "com.palmdts.devmode", logo: "developermode.svg", mono: true, glow: "#8eb4ff" }
  ];

  var grid = document.getElementById("grid");
  var clock = document.getElementById("clock");
  var dateLine = document.getElementById("date");
  var action = document.getElementById("action");
  var stage = document.getElementById("stage");
  var hud = document.getElementById("hud");
  var focusKeeper = null;
  var hudTimer = null;
  var buttons = [];
  var index = 0;
  var COLS = 4;
  var leftOnPurpose = false;
  var lastWake = 0;
  var siteOpen = false;
  var PROXY = "http://192.168.0.156:8733/";

  function fit() {
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "scale(" + scale + ")";
  }

  function isTV() {
    return typeof window.PalmSystem !== "undefined" || typeof window.PalmServiceBridge !== "undefined";
  }

  function tick() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var suffix = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if (hours === 0) hours = 12;
    var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    clock.textContent = hours + ":" + (minutes < 10 ? "0" : "") + minutes + " " + suffix;
    dateLine.textContent = days[now.getDay()] + ", " + months[now.getMonth()] + " " + now.getDate();
  }

  function luna(method, params, onDone) {
    if (typeof window.PalmServiceBridge === "undefined") {
      if (onDone) onDone({ returnValue: false });
      return;
    }
    var bridge = new window.PalmServiceBridge();
    bridge.onservicecallback = function (message) {
      var result = { returnValue: false };
      try { result = JSON.parse(message); } catch (error) {}
      if (onDone) onDone(result);
    };
    bridge.call("luna://com.webos.applicationManager/" + method, JSON.stringify(params));
  }

  function openHere(url) {
    window.location.assign(url);
  }

  function openInBrowser(url) {
    luna("launch", { id: "com.webos.app.browser", params: { target: url } }, function (result) {
      if (result && result.returnValue !== false) return;
      luna("launch", { id: "com.webos.app.browser", params: { url: url } }, function (second) {
        if (!second || second.returnValue === false) openHere(url);
      });
    });
  }

  function openOnPC(url) {
    fetch("/open", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: url })
    }).catch(function () {
      window.location.assign(url);
    });
  }

  function sendKey(down, keyCode) {
    var frame = document.getElementById("site");
    if (!frame || !frame.contentWindow) return;
    try {
      frame.contentWindow.postMessage({ type: "key", down: down, keyCode: keyCode }, "*");
    } catch (error) {}
  }

  function showSite() {
    var site = document.getElementById("site");
    siteOpen = true;
    site.src = "spelunkr.html";
    site.className = "site open";
    // Transparent + no transform so webOS composites hardware video underneath.
    document.body.classList.add("playing");
    stage.style.transform = "none";
    try {
      if (window.PalmSystem && window.PalmSystem.setCursorVisible) {
        window.PalmSystem.setCursorVisible(false);
      }
    } catch (error) {}
    if (focusKeeper) { clearInterval(focusKeeper); focusKeeper = null; }
    if (hud) hud.style.display = "none";
    // spelunkr.html is our own same-origin app; give it real focus so its
    // D-pad and number keys work natively. It posts "spelunkr-exit" to leave.
    setTimeout(function () {
      try {
        site.focus();
        if (site.contentWindow) site.contentWindow.focus();
      } catch (e) {}
    }, 60);
  }

  function hideSite() {
    var site = document.getElementById("site");
    siteOpen = false;
    if (focusKeeper) { clearInterval(focusKeeper); focusKeeper = null; }
    if (hudTimer) { clearTimeout(hudTimer); hudTimer = null; }
    if (hud) hud.style.display = "none";
    site.className = "site";
    site.src = "about:blank";
    document.body.classList.remove("playing");
    fit();
    try {
      if (window.PalmSystem && window.PalmSystem.setCursorVisible) {
        window.PalmSystem.setCursorVisible(true);
      }
    } catch (error) {}
    paint();
  }

  function wake() {
    var now = Date.now();
    if (!isTV() || leftOnPurpose || now - lastWake < 250) return;
    lastWake = now;
    luna("launch", { id: "tv.livingroom.shell" });
  }

  function activate(service) {
    if (service.keys) {
      // Navigate the whole app to our Spelunkr page (top-level so webOS
      // composites the <video>; an iframe would play audio only).
      window.location.href = "spelunkr.html";
      return;
    }
    if (!isTV()) {
      openOnPC(service.url);
      return;
    }
    leftOnPurpose = true;
    if (service.web || !service.appId) {
      openInBrowser(service.url);
      return;
    }
    luna("launch", { id: service.appId }, function (result) {
      if (!result || result.returnValue === false) openHere(service.url);
    });
  }

  function describe(service) {
    if (!isTV()) return "Enter opens " + service.name;
    if (service.web || !service.appId) return "Enter opens " + service.name + " here";
    return "Enter opens " + service.name + " on the TV";
  }

  function paint() {
    var i;
    for (i = 0; i < buttons.length; i++) {
      buttons[i].className = i === index ? "tile focused" : "tile";
    }
    action.textContent = describe(SERVICES[index]);
    if (buttons[index]) buttons[index].focus();
  }

  function move(delta) {
    var next = index + delta;
    if (next < 0 || next >= SERVICES.length) return;
    index = next;
    paint();
  }

  var i;
  for (i = 0; i < SERVICES.length; i++) {
    (function (service, itemIndex) {
      var button = document.createElement("button");
      button.className = "tile";
      button.type = "button";
      button.style.setProperty("--glow", service.glow);
      var mark = document.createElement("div");
      mark.className = "mark";
      var wash = document.createElement("span");
      wash.className = "wash";
      var logo = document.createElement("img");
      logo.className = service.mono ? "logo mono" : "logo";
      logo.alt = "";
      logo.src = "logos/" + service.logo;
      mark.appendChild(wash);
      mark.appendChild(logo);
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = service.name;
      button.appendChild(mark);
      button.appendChild(name);
      button.addEventListener("click", function () {
        index = itemIndex;
        paint();
        activate(service);
      });
      grid.appendChild(button);
      buttons.push(button);
    })(SERVICES[i], i);
  }

  document.addEventListener("keydown", function (event) {
    var key = event.keyCode;
    if (siteOpen) {
      // Our in-app Spelunkr owns all keys while open and tells us when to close.
      return;
    }
    if (key === 37) { event.preventDefault(); move(-1); }
    else if (key === 39) { event.preventDefault(); move(1); }
    else if (key === 38) { event.preventDefault(); move(-COLS); }
    else if (key === 40) { event.preventDefault(); move(COLS); }
    else if (key === 13) {
      event.preventDefault();
      activate(SERVICES[index]);
    } else if (key === 461 || key === 773) {
      event.preventDefault();
    }
  }, true);

  document.addEventListener("keyup", function (event) {
    if (!siteOpen) return;
    event.preventDefault();
    sendKey(false, event.keyCode);
  }, true);

  window.addEventListener("blur", function () {
    // The iframe took focus; pull it back so Back stays catchable.
    if (siteOpen) {
      setTimeout(function () {
        try { var s = document.getElementById("site"); if (s && s.contentWindow) s.contentWindow.focus(); } catch (e) {}
      }, 0);
    }
  });

  // Our in-app Spelunkr tells us when the user backed out of its home screen.
  window.addEventListener("message", function (event) {
    var d = event.data || {};
    if (d && d.type === "spelunkr-exit") { hideSite(); }
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      leftOnPurpose = false;
      return;
    }
    wake();
  });
  setInterval(function () {
    if (document.hidden) wake();
  }, 80);

  window.addEventListener("resize", fit);
  fit();
  tick();
  setInterval(tick, 15000);
  paint();
})();
</script>
</body>
</html>
